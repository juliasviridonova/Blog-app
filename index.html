<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog-app</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="wrapper">
        
        <!-- Карточка для создания поста (теперь это один блок) -->
        <div class="card">
            <h2>Новый пост</h2>

            <input class="js-post-title-input post-title-input" type="text" placeholder="Заголовок поста">
            
            <textarea class="js-post-text-input post-text-input" placeholder="Напиши текст поста..."></textarea>
            
            <button class="js-new-post-btn new-post-btn">
                Опубликовать
            </button>

            <div class="js-title-error title-error">
                Заголовок больше 100 символов
            </div>

            <div class="js-text-error text-error">
                Пост больше 200 символов
            </div>
        </div>

        <!-- Лента постов -->
        <h2 class="section-title">Лента</h2>
        <div class="js-posts posts">
            <p class="post">Лента пуста....</p>
        </div>
    </div>

    

    <script src="index.js"></script>
</body>
</html>
